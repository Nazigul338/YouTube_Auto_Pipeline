# Ниша профили: Мотивация жана психология (орус тилдүү канал)
#
# Жаңы ниша кошуу үчүн ушул файлды көчүрүп (мис. cooking.yaml),
# промптторду жана жөндөөлөрдү өзгөртүңүз.

title: "Мотивация жана психология"

# Config'теги демейки маанилерди алмаштыруу (керек болсо)
config:
  language: ru
  words_min: 1100
  words_max: 1200
  tts_voice: Algenib

# Сценарий жазуучунун ролу (1-этапта колдонулат).
# Эски блокноттогу (legacy/) промпттордун негизинде.
script_role: >
  Ты — оригинальный автор психологических и мотивационных YouTube-сценариев
  для русскоязычной аудитории.

script_rules:
  - Напиши текст самостоятельно, с нуля. Не копируй статьи, книги, чужие видео.
  - Не имитируй конкретных авторов и блогеров.
  - Избегай банальных мотивационных фраз и клише.
  - Используй необычные жизненные примеры и оригинальные сравнения.
  - Объясняй психологические идеи простым языком, осторожно и точно.
  - Не выдумывай исследования, статистику, цифры и медицинские факты.
  - Не делай категоричных обобщений («все люди…», «всегда…»).
  - Начало должно захватывать внимание в первые 10 секунд.
  - Каждые 30–45 секунд — новый поворот, вопрос или жизненная ситуация.
  - Добавь практические советы и одно простое упражнение на сегодня.
  - Финал — эмоциональный, сильный и запоминающийся.
  - Не повторяй одну мысль разными словами.
  - Без заголовков, нумерации и служебных пояснений — только текст для озвучки.

# Үндүн стили (3-этапта колдонулат)
tts_style: >
  Deep, strong, mature Russian male voice. Calm, confident and sincere
  motivational storytelling. Unhurried pace with natural pauses between
  sentences and varied intonation. Avoid monotonous delivery.

# Визуалдык стиль (5-этапта издөө сөздөрүнө кошулат)
visual_style: "cinematic, moody, natural light, people, city, nature"

# Музыканын маанайы (6-этап)
music_mood: "inspirational, calm, emotional, cinematic"

# Баяндоо стилдери (эреже 3, 12): ар видеого эң аз колдонулган стиль тандалат.
narrative_styles:
  story: >
    Начни с короткой жизненной истории вымышленного, но правдоподобного человека
    (прямо скажи, что это пример). История проходит через весь текст и получает развязку в финале.
  question: >
    Начни с неожиданного, точного вопроса к зрителю, на который трудно ответить сразу.
    Весь текст — постепенный, честный поиск ответа.
  myth: >
    Начни с распространённого убеждения, которое кажется очевидным, и аккуратно покажи,
    почему оно неполное. Не высмеивай зрителя.
  analysis: >
    Психологический разбор: шаг за шагом объясни механизм — что происходит в голове,
    почему, к чему это ведёт и как это изменить. Спокойный, ясный тон.
  letter: >
    Текст как личное обращение к зрителю — тёплый монолог «от меня к тебе»,
    честный и без пафоса, с паузами для размышления.
  contrast: >
    Сравни два пути или двух людей в одной ситуации: что отличает их решения и мышление.
    Без деления на «плохих» и «хороших».
  experiment: >
    Предложи зрителю мысленный эксперимент в начале и возвращайся к нему по ходу текста;
    в конце — вывод, который зритель делает сам.

# Музыканын маанайлары (эреже 8): тректер ушул категорияларга бөлүнөт.
music_moods: [emotional_piano, cinematic, dark_cinematic, inspirational, dramatic, motivational_ambient]
