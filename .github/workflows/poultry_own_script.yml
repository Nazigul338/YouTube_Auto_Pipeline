name: "✍️ Poultry — өз текстиңизден Reel пакети"
# LLM жообу normalize() аркылуу текшерилет (2026-11-19)
on:
  workflow_dispatch:
  push:
    branches: [claude/youtube-auto-pipeline-87d41t]
    paths: [poultry_ig_agent/scripts_own/queue/**, .github/workflows/poultry_own_script.yml]
permissions:
  contents: write
concurrency: {group: poultry-own-script, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: ffmpeg
        timeout-minutes: 6
        run: bash poultry_ig_agent/tools/ensure_ffmpeg.sh
      - run: pip install -q -r poultry_ig_agent/requirements.txt
      - name: Тесттер
        run: python -m unittest discover -s poultry_ig_agent/tests -t .
      - name: Текст → пост → диктор үнү
        env:
          POULTRY_GEMINI_API_KEY: ${{ secrets.POULTRY_GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p poultry_ig_agent/deliveries poultry_ig_agent/scripts_own/done
          shopt -s nullglob
          FAILED=0
          for f in poultry_ig_agent/scripts_own/queue/*.txt; do
            name=$(basename "$f" .txt)
            echo "== $name"
            if ! res=$(python -m poultry_ig_agent.agent run --own-text-file "$f" --type education --topic chicks --lang ky | tail -1); then
              echo "::error::$name — пост жасалган жок (логду караңыз)"; FAILED=1; continue
            fi
            echo "$res"
            pid=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$res")
            python -m poultry_ig_agent.agent voice "$pid" || echo "::warning::$name үнү чыккан жок"
            mkdir -p "poultry_ig_agent/deliveries/$name"
            cp poultry_ig_agent/out/"$pid"/{post.json,caption.txt,voiceover.txt} "poultry_ig_agent/deliveries/$name/"
            [ -f poultry_ig_agent/out/"$pid"/voice.mp3 ] && cp poultry_ig_agent/out/"$pid"/voice.mp3 "poultry_ig_agent/deliveries/$name/"
            git mv "$f" "poultry_ig_agent/scripts_own/done/$name.txt"
          done
          exit $FAILED
      - name: Натыйжаны commit
        if: always()
        run: |
          bash poultry_ig_agent/tools/commit_push.sh "Өз текст пакеттери: Reel + диктор үнү" poultry_ig_agent/deliveries poultry_ig_agent/scripts_own
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: poultry-own-script-logs, path: poultry_ig_agent/out/logs}
