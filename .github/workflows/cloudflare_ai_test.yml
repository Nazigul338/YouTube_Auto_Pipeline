name: ☁️ Cloudflare AI сыноо (FLUX.1 schnell, акысыз лимит)

# Cloudflare Workers AI акысыз лимитин көзөмөлдөйт (10 000 neuron/күн, 10% резерв) жана FLUX.1 schnell тести.
#   status — сүрөт жаратпайт, dashboard гана (бекер);  test — ≤5 сүрөт, ар биринин чыныгы чыгымы өлчөнөт.
# Видео системасына (make_video) тийбейт. Акы төлөнүүчү режимге өтпөйт.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "status — лимит; test — FLUX schnell 1–5 сүрөт; models — уруксаттар+моделдер (сүрөтсүз); image — 1 кинематографиялык сүрөт → Drive TEST"
        default: status
        type: choice
        options: [status, test, models, image]
      model:
        description: "(image режими) модель, мис. @cf/leonardo/lucid-origin; бош — сапаттуусунан баштап тандалат"
        required: false
        type: string
      images:
        description: "test режиминде сүрөт саны (1–5)"
        default: "5"
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions:
  contents: read

concurrency:
  group: cloudflare-ai-test
  cancel-in-progress: false

jobs:
  flux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Китепканалар (Drive журналы үчүн)
        run: pip install -q google-api-python-client google-auth
      - name: Лимит мониторинги / тест
        env:
          # Секреттер env аркылуу гана өтөт; GitHub аларды логдо *** менен жашырат, код да чыгарбайт.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          CF_MODE: ${{ inputs.mode }}
          CF_IMAGES: ${{ inputs.images }}
          CF_MODEL: ${{ inputs.model }}
          CF_OUT: cf_test
        run: |
          if [ "$CF_MODE" = "models" ] || [ "$CF_MODE" = "image" ]; then
            python -m pipeline.cf_image_probe
          else
            python -m pipeline.cf_probe
          fi
      - name: Натыйжа (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-flux-test
          path: cf_test/
          if-no-files-found: ignore
          retention-days: 14
