name: "🐔 Poultry Instagram — драфт жасоо"
on:
  workflow_dispatch:
    inputs:
      days: {description: "План күнү", default: "7"}
      n: {description: "Канча пост даярдалсын", default: "3"}
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r poultry_ig_agent/requirements.txt
      - run: python -m unittest discover -s poultry_ig_agent/tests -t .
      - env: {POULTRY_GEMINI_API_KEY: "${{ secrets.POULTRY_GEMINI_API_KEY }}"}
        run: |
          python -m poultry_ig_agent.agent plan --days "${{ inputs.days }}"
          python -m poultry_ig_agent.agent make --n "${{ inputs.n }}"
          python -m poultry_ig_agent.agent list
      - uses: actions/upload-artifact@v4
        with: {name: poultry-drafts, path: poultry_ig_agent/out}
