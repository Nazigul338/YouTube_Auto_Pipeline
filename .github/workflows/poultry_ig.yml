name: "🐔 Poultry Instagram — драфт жасоо"
on:
  workflow_dispatch:
    inputs:
      days: {description: "План күнү", default: "7"}
      n: {description: "Канча пост даярдалсын", default: "3"}
jobs:
  draft:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: poultry_ig_agent}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
      - env: {GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"}
        run: |
          python agent.py plan --days "${{ inputs.days }}"
          python agent.py make --n "${{ inputs.n }}"
          python agent.py list
      - uses: actions/upload-artifact@v4
        with: {name: poultry-drafts, path: poultry_ig_agent/out}
