name: "🐔 Poultry Instagram — START (контент → видео → бекитүүгө даяр)"
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема (бош = автоматтык айлануу)"
        default: ""
        type: choice
        options:
          - 'auto'
          - 'broiler'
          - 'layers'
          - 'chicks'
          - 'feeding'
          - 'vitamins'
          - 'coop'
          - 'hygiene'
          - 'prevention'
          - 'vaccination'
          - 'economics'
          - 'start'
          - 'daily'
      content_type:
        description: "Максат / түр (education=билим, sales=сатуу, ...)"
        default: education
        type: choice
        options:
          - 'education'
          - 'viral'
          - 'practical'
          - 'real_farm'
          - 'customer_q'
          - 'sales'
      format:
        description: "Reels / Stories / карусель"
        default: reel
        type: choice
        options:
          - reel
          - story
          - carousel
      lang:
        description: "Тил"
        default: ky
        type: choice
        options:
          - ky
          - ru
      make_video:
        description: "Reel видеосун да жаса (Veo + диктор + монтаж)"
        type: boolean
        default: false
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: ffmpeg (бар болсо өткөрүлөт)
        timeout-minutes: 6
        run: command -v ffmpeg >/dev/null && echo "ffmpeg бар - $(ffmpeg -version | head -1)" || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core)
      - run: pip install -r poultry_ig_agent/requirements.txt
      - name: Тесттер (Motivation'го тийбейт)
        run: python -m unittest discover -s poultry_ig_agent/tests -t .
      - name: START
        env:
          POULTRY_GEMINI_API_KEY: ${{ secrets.POULTRY_GEMINI_API_KEY }}
          POULTRY_ELEVENLABS_API_KEY: ${{ secrets.POULTRY_ELEVENLABS_API_KEY }}
        run: |
          python -m poultry_ig_agent.agent check
          ARGS="--type ${{ inputs.content_type }} --format ${{ inputs.format }} --lang ${{ inputs.lang }}"
          if [ "${{ inputs.topic }}" != "auto" ]; then ARGS="$ARGS --topic ${{ inputs.topic }}"; fi
          if [ "${{ inputs.make_video }}" = "true" ]; then ARGS="$ARGS --video"; fi
          python -m poultry_ig_agent.agent run $ARGS
          python -m poultry_ig_agent.agent list
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: poultry-package, path: poultry_ig_agent/out}
