name: 🎬 Hook 16:9 (QR коддор, архивдик сүрөттөр)

# Tech History (EN): «The Car Parts That Created QR Codes» — ≤5 сек кинематографиялык hook + Масахиро Хара окуясына көпүрө.
# Сүрөттөр: Pixabay (Gemini көрүү тандайт, логотип/бет жок), Харанын портрети — Wikimedia Commons'тон ЭРКИН лицензия менен гана.
# Диктор: Gemini TTS (Algenib). Жыйынтык: run бетиндеги Artifacts → «qr_hook_16x9» (MP4 + JSON + сүрөттөр). Drive'га жазбайт.
# ~3–6 мүн, Colab керек эмес.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Диктордун үнү (Gemini TTS). Өчүк болсо — үнсүз превью"
        required: false
        default: true
        type: boolean
  push:
    branches: [ccr-3cbc1b33-ozioi4]
    paths: [pipeline/history_hook.py, .github/workflows/history_hook.yml]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg жана шрифттер (Inter Black, JetBrains Mono — OFL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-jetbrains-mono fonts-dejavu-core

      - name: Китепканалар
        run: pip install -q -r requirements.txt Pillow

      - name: Тесттер
        env:
          YTA_SKIP_SLOW: "1"
        run: python -m unittest tests.test_history_hook

      - name: Рендер
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VOICE: ${{ github.event_name == 'push' || inputs.voice }}
        run: |
          if [ "$VOICE" = "true" ]; then
            python -m pipeline.history_hook --out out/qr_hook_16x9.mp4 --fetch --tts
          else
            python -m pipeline.history_hook --out out/qr_hook_16x9.mp4 --fetch
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr_hook_16x9
          path: |
            out/qr_hook_16x9.mp4
            out/qr_hook_16x9.json
            out/photos/*.jpg
            out/photos/photos.json
          retention-days: 14
