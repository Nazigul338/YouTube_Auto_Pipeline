name: ⏱ Тайм-код текшерүү (Video_001/004 cinematic)

# Даяр MP4'терди Drive'дан жүктөп, Whisper менен ар главанын чыныгы убактысын YouTube тайм-коду менен салыштырат.
# Окуу гана: Drive'га эч нерсе жазылбайт.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Китепканалар
        run: pip install -q -r requirements.txt
      - name: Текшерүү
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -m pipeline.chapter_check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chapter-check
          path: chapter_check/
          if-no-files-found: ignore
          retention-days: 14
