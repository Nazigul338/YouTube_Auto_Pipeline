name: "🎧 Poultry — Gemini TTS кыргызча үн сыноосу"
on:
  workflow_dispatch:
  push:
    branches: [ccr-e9f49a12-c7fuhx]
    paths: [poultry_ig_agent/voice_probe/gemini_request.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: ffmpeg (бар болсо өткөрүлөт)
        timeout-minutes: 6
        run: bash poultry_ig_agent/tools/ensure_ffmpeg.sh
      - name: Үн чыгаруу
        env:
          POULTRY_GEMINI_API_KEY: ${{ secrets.POULTRY_GEMINI_API_KEY }}
        run: |
          if [ -z "$POULTRY_GEMINI_API_KEY" ]; then echo "::error::POULTRY_GEMINI_API_KEY secret коюлган эмес"; exit 1; fi
          python -m poultry_ig_agent.tools.gemini_voice_probe --text-file poultry_ig_agent/voice_probe/text_ky.txt \
            --outdir poultry_ig_agent/voice_probe/samples
      - name: mp3'терди commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poultry_ig_agent/voice_probe/samples
          git commit -m "Gemini TTS сыноо үндөрү (mp3)" && git push
