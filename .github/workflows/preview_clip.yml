name: ▶️ Кыска үзүндү (телефон үчүн)

# Даяр видеодон 1 мүнөттүк (же берилген) үзүндү кесип, Drive'га <root>/_preview/ салат. Видеонун өзү өзгөрбөйт.
on:
  workflow_dispatch:
    inputs:
      video_file:
        description: "Final_Videos ичиндеги файл"
        required: true
        default: Video_003_cinematic.mp4
        type: string
      video_id:
        description: "Видео ID (карточкалардын убактысы үчүн)"
        required: true
        default: Video_003
        type: string
      seconds:
        description: "Узактыгы (сек)"
        required: true
        default: "60"
        type: string
      test_run:
        description: "YouTube_Auto_TEST папкасынан"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Үзүндү
        env:
          VIDEO_FILE: ${{ inputs.video_file }}
          VIDEO_ID: ${{ inputs.video_id }}
          PREVIEW_SEC: ${{ inputs.seconds }}
          YTA_DRIVE_FOLDER: ${{ inputs.test_run && 'YouTube_Auto_TEST' || 'YouTube_Auto' }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -m pipeline.make_preview
