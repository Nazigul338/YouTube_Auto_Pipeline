name: 🔬 Concat/декод диагностикасы

# GitHub'тагы FFmpeg менен: `-c copy` сахна файлын толук декодтойбу? Эч нерсени өзгөртпөйт, Drive керек эмес.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - name: Диагностика
        run: python -m pipeline.probe_concat
