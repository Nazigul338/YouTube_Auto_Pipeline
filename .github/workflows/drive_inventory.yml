name: 🗂 Drive инвентаризациясы (окуу гана)

# Drive'дагы бардык файлдарды көлөмү/папкасы менен тизмелейт жана категорияга бөлөт.
# ЭЧ НЕРСЕ ӨЧҮРҮЛБӨЙТ: files.list жана about.get гана колдонулат.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q google-api-python-client google-auth
      - name: Инвентаризация
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -m pipeline.drive_inventory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drive-inventory
          path: drive_inventory/
          if-no-files-found: ignore
          retention-days: 30
