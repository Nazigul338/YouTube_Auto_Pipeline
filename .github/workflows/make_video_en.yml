name: 🇺🇸 Tech History (EN) видео жасоо

# Англисче «Tech History» каналы (2026-11-24): ниша tech_history, Drive тамыры YouTube_Auto_EN (сынак — YouTube_Auto_EN_TEST).
# Орусча мотивация каналы (make_video.yml) өзгөргөн жок. Colab талап кылынбайт. Бардык этаптар ушул жерде (GitHub'дын серверинде) аткарылат.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема АНГЛИСЧЕ (мис. «The rise and fall of Lotus 1-2-3»)"
        required: false
        type: string
      video_id:
        description: "Токтоп калган видеону улантуу үчүн ID (мис. Video_001). Жаңы видео үчүн бош калтырыңыз"
        required: false
        type: string
      rerun_from:
        description: "Ушул этаптан баштап кайра жасоо (video_id менен)"
        required: false
        default: none
        type: choice
        options: [none, s1_script, s2_scenes, s3_voice, s4_subtitles, s5_visuals,
                  s6_animation, s7_music, s8_render, s9_qa]
      test_run:
        description: "Сынак режими: YouTube_Auto_EN_TEST/ папкасына жазат"
        required: false
        default: false
        type: boolean
      stop_after:
        description: "Ушул этаптан кийин токтотуу (тест үчүн)"
        required: false
        default: none
        type: choice
        options: [none, s1_script, s2_scenes, s3_voice, s4_subtitles, s5_visuals,
                  s6_animation, s7_music, s8_render]

permissions:
  contents: read

# Бир убакта бир гана видео жасалат (API лимиттери жана реестр үчүн)
concurrency:
  group: make-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: FFmpeg жана шрифттер
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-montserrat || \
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Whisper модели (кэш)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Китепканалар
        run: pip install -q -r requirements.txt

      - name: HyperFrames (бекитилген версия) + браузер
        continue-on-error: true       # иштебесе да видео ASS карточкалары менен жасалат
        env:
          HYPERFRAMES_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
        run: |
          cd tools/hyperframes
          npm ci --no-fund --no-audit
          npx hyperframes --version
          npx hyperframes browser ensure

      - name: Тесттер
        env:
          YTA_SKIP_SLOW: "1"   # узак интеграциялык тест ар иштетүүдө керек эмес
        run: python -m unittest discover tests

      - name: Видео жасоо
        env:
          # Тема shell'ге түз коюлбайт (injection'дан сактоо үчүн) — env аркылуу өтөт
          VIDEO_TOPIC: ${{ inputs.topic }}
          VIDEO_ID: ${{ inputs.video_id }}
          VIDEO_NICHE: tech_history
          VIDEO_RERUN_FROM: ${{ inputs.rerun_from }}
          VIDEO_STOP_AFTER: ${{ inputs.stop_after }}
          YTA_DRIVE_FOLDER: ${{ inputs.test_run && 'YouTube_Auto_EN_TEST' || 'YouTube_Auto_EN' }}
          # Колдонуучу бекитти (2026-11-20): cinematic монтаж, угулуучу музыка, үн эффекттери, мотивациялык диктор.
          # AI-сүрөттөр өчүк (billing жок).
          YTA_CINEMATIC: "1"
          YTA_HYPERFRAMES: "1"
          YTA_SFX: "1"
          HYPERFRAMES_NO_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
        run: python -m pipeline.ci
      # Видео жана логдор Drive'га сакталат. Ачык репозиторий болгондуктан артефакт жок.
